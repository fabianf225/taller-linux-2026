---
- name: Configure database server
  hosts: ubuntu01
  become: true
  vars_files:
    - ../vars/database.yaml

  tasks:

    - name: Install MariaDB server
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        update_cache: true

    - name: Start and enable MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    - name: Install PyMySQL
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    - name: Create cumples database
      community.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Generate database schema and initial data
      ansible.builtin.template:
        src: ../templates/cumple.sql.j2
        dest: /tmp/cumple.sql
        owner: root
        group: root
        mode: "0600"

    - name: Check if cumpleanios table already has data
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        login_db: "{{ DB_DBASE }}"
        query: "SELECT COUNT(*) AS total FROM cumpleanios"
      register: cumpleanios_check
      ignore_errors: true

    - name: Import schema and initial data
      community.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: import
        target: /tmp/cumple.sql
        login_unix_socket: /run/mysqld/mysqld.sock
      when:
        - cumpleanios_check.failed or cumpleanios_check.query_result[0][0].total == 0

    - name: Create application database user
      community.mysql.mysql_user:
        name: "{{ DB_USER }}"
        password: "{{ DB_PASS }}"
        priv: "{{ DB_DBASE }}.*:SELECT"
        host: "{{ hostvars['centos01']['ansible_host'] }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      no_log: true

    - name: Configure MariaDB to listen on all interfaces
      ansible.builtin.template:
        src: ../templates/50-server.cnf.j2
        dest: /etc/mysql/mariadb.conf.d/50-server.cnf
        owner: root
        group: root
        mode: "0644"
      notify: Restart mariadb

    - name: Allow MariaDB access only from app server
      community.general.ufw:
        rule: allow
        port: "3306"
        proto: tcp
        from_ip: "{{ hostvars['centos01']['ansible_host'] }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

  handlers:

    - name: Restart mariadb
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted
